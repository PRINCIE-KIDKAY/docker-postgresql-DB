services:
  db:
    container_name: my-postgres-db
    image: postgres
    restart: always
    environment:
      POSTGRES_USER: postgres          # ✅ Custom username
      POSTGRES_PASSWORD: 123456     # ✅ Custom password
      POSTGRES_DB: postgres        # ✅ Custom database name
    ports:
      - "5532:5432"  # Expose to any localhost port
    volumes:
      - pgdata:/var/lib/postgresql/data 
 
  adminer:
    image: adminer
    restart: always
    ports:
      - 8180:8080 # Expose to any localhost port
 
volumes:
  pgdata: